# Default configuration file
# Any parameters redifined in main.yaml will override these defaults.
# Parameters left null here are required to be set in main.yaml.

logging:
  log_interval: 10

experiment:
  name: default_experiment
  random_seed: 42
  plot_examples: True
  save: True

to_tensor:
  _target_: src.data.transforms.ExtractToTensor
  field: emg

data:
  data_dir: data
  metadata_file: ${data.data_dir}/metadata.csv
  window_length: null
  stride: null
  num_workers: 4
  subsample: 1.0
  padding: [0, 0]
  skip_ik_failures: True
  batch_size: 64
  # Window transforms are applied to each window of emg. Sample transforms are applied to the whole sample dict
  transforms:
    train:
      - ${to_tensor}
      - ${band_pass}
      # - _target_: src.data.transforms.RotationAugmentation
      
    val:
      - ${to_tensor}
      - ${band_pass}
      # - _target_: src.data.transforms.RotationAugmentation
    test: ${transforms.val}

model:
  name: soundstream
  checkpoint: null


