defaults:
  - _self_
  - dataset: ninapro_db5
  - model: neurorvq
  - transforms: transforms

task: 
  name: finetune_classification

logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "emg_fm_benchmarking"

# Global experiment settings that use interpolation
experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}_${model.fm.name}_${data.root_key}_${data.window_length}_${data.split_type}_${finetuning.freeze_backbone}_${model.wrapper.pooling_type}
  random_seed: 42
  plot_examples: True
  save: True
  find_batch_size: True

training:
  patience: 8
  epochs: 100
  use_amp: True

# TODO split params into their own section
finetuning:
  # Needed by the task
  target_field: gesture_id
  freeze_backbone: False
  from_scratch: False
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 5

