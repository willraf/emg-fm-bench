# Default configuration file
# Any parameters redifined in main.yaml will override these defaults.
# Parameters left null here are required to be set in main.yaml.

logging:
  log_interval: 10

experiment:
  name: default_experiment
  random_seed: 42
  plot_examples: True
  save: True

to_tensor:
  _target_: src.data.transforms.ExtractToTensor
  field: emg

data:
  data_dir: data
  metadata_file: ${data.data_dir}/metadata.csv
  window_length: 2000
  num_workers: 4
  subsample: 1.0
  padding: [0, 0]
  skip_ik_failures: True
  batch_size: 64
  transforms:
    train:
      - ${to_tensor}
      # - _target_: emg2pose.transforms.RotationAugmentation
    val:
      - ${to_tensor}
    test: ${transforms.val}

model:
  name: soundstream
  checkpoint: null

training:
  optimizer: adam
  epochs: 10
  learning_rate: null
  momentum: 0
  weight_decay: 0
  patience: null
  val_split: null
  loss_function: null

validation:
  batch_size: null



evaluation:



inference:

