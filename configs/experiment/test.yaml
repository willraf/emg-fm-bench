# @package _global_
defaults:
  - override /dataset: ninapro_db5
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: inter_subject
  batch_size: 1

finetuning:
  freeze_backbone: True
  learning_rate: 0.0001

experiment:
  name: TEST
  ddp_debug_mode: True
  resume: False
  random_seed: 42
  plot_examples: True
  save: True
  find_batch_size: True
  # For automatic batch size finding and lr scaling
  base_batch_size: 128
  base_learning_rate: 0.0001
  # If batch size found is less than this, gradient acumulation will be used to simulate larger batch sizes
  min_batch_size: 32


logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "TEST"

training:
  epochs: 1

