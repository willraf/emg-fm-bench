# @package _global_
defaults:
  - override /dataset: uci_emg
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: inter_subject
  batch_size: 32

finetuning:
  freeze_backbone: True
  learning_rate: 0.00001

logging:
  log_interval: 10
  use_wandb: False
  wandb_project: "neurorvq_uci_emg"

experiment:
  name: TEST

model:
  wrapper:
    pooling_type: concat


