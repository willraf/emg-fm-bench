# @package _global_
defaults:
  - override /dataset: ninapro_db5
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_duration: 1.0
  stride_duration: 0.25
  # split_type: inter_subject
  split_type: loso
  loso_subject: null
  batch_size: 1

task:
  freeze_backbone: True
  learning_rate: 0.0001

experiment:
  name: TEST
  ddp_debug_mode: True
  resume: False
  random_seed: 42
  plot_examples: True
  save: True
  find_batch_size: True


logging:
  log_interval: 10
  use_wandb: False
  wandb_project: "TEST"

training:
  epochs: 4

