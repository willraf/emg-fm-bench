# @package _global_
defaults:
  - override /dataset: epn612
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_length: 200
  split_type: intra_session
  batch_size: 32

finetuning:
  freeze_backbone: True
  learning_rate: 0.00001

logging:
  log_interval: 10
  use_wandb: False
  wandb_project: "neurorvq_ninaprodb5"

experiment:
  name: TEST

