# @package _global_
defaults:
  - override /dataset: epn612
  - override /model: tinymyo
  - override /transforms: transforms
  - _self_

logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_epn612"

data:
  window_length: 1000
  split_type: intra_session
  batch_size: 128
  # Not includign resample to test original method done by TinyMyo
  transforms:
    train:
      - ${transforms.standardise}
      - ${transforms.band_pass}
      - ${transforms.per_channel_z_score_normalise}
      - ${transforms.random_scale}
      - ${transforms.channel_dropout}
      
    val:
      - ${transforms.standardise}
      - ${transforms.band_pass}
      - ${transforms.per_channel_z_score_normalise}

    test: ${data.transforms.val}


finetuning:
  freeze_backbone: False
  learning_rate: 0.0001

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data.window_length: 200, 1000
      # data.split_type: inter_subject,intra_session
      # finetuning.freeze_backbone: True,False