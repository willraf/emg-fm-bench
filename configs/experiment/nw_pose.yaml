# @package _global_
defaults:
  - override /transforms: transforms
  - override /dataset: neuromotor_wrist
  - override /model: physiowave
  - _self_

data:
  window_length: 200
  split_type: intra_session
  batch_size: 2
  # 2 joint angles for regression task
  n_classes: 2

experiment:
  name: regression/${data.root_key}/${model.fm.name}_${data.window_length}_${data.split_type}_frozen-${task.freeze_backbone}_scratch-${task.from_scratch}_${model.wrapper.pooling_type}/seed${experiment.random_seed}
  log_interval: 10
  # wandb_project: ${data.root_key}
  random_seed: 50
  use_wandb: True
  wandb_project: ${data.root_key}


# task specific parameters
task:
  name: finetune_regression
  target_field: jntang
  learning_rate: 0.00001
  weight_decay: 0.001
  warmup_epochs: 10
  use_amp: True
  freeze_backbone: False
  from_scratch: False

model:
  wrapper:
    pooling_type: mean


hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # data.split_type: intra_session, inter_subject
      # model.wrapper.pooling_type: mean, time_concat_chan_mean, chan_concat_time_mean
      model: neurorvq, tinymyo, physiowave
      # data.window_duration: 1.0, 5.0
      # dataset: epn612, ninapro_db5, uci_emg 
      # task.from_scratch: False, True
      # task.freeze_backbone: True,False
      # experiment.random_seed: 2, 50, 100
