# @package _global_
defaults:
  - override /transforms: transforms
  - override /dataset: ninapro_db5
  - _self_

model:
  name: lda

data:
  window_length: 1000
  split_type: inter_subject
  batch_size: 2

experiment:
  name: ${data.root_key}/${model.name}_${data.window_length}_${data.split_type}/seed${experiment.random_seed}
  log_interval: 10
  wandb_project: ${data.root_key}

  
