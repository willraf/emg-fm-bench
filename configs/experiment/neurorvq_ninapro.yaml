# @package _global_
defaults:
  - override /dataset: ninapro_db5
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: intra_session
  batch_size: 16

finetuning:
  freeze_backbone: True
  learning_rate: 0.0001


logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_ninaprodb5"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # data.window_length: 200, 1000
      data.split_type: intra_session, inter_subject
      # finetuning.freeze_backbone: True,False