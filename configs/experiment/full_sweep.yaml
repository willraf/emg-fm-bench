# @package _global_
defaults:
  - override /transforms: transforms
  - override /dataset: ninapro_db5
  - override /model: tinymyo
  - _self_

data:
  window_duration: 1.0
  stride_duration: 0.25
  split_type: inter_subject
  batch_size: 2
  # 22 joint angles for regression task
  n_classes: 22

experiment:
  name: final/regression/${data.root_key}/${model.fm.name}_${data.window_duration}_${data.split_type}_frozen-${task.freeze_backbone}_scratch-${task.from_scratch}_${model.wrapper.pooling_type}/seed${experiment.random_seed}
  log_interval: 10
  wandb_project: ${data.root_key}
  random_seed: 50
  use_wandb: False


# task specific parameters
task:
  name: finetune_regression
  target_field: jntang
  learning_rate: 0.00001
  weight_decay: 0.001
  warmup_epochs: 10
  use_amp: True
  freeze_backbone: True
  from_scratch: False

model:
  wrapper:
    pooling_type: time_concat_chan_mean


hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # data.split_type: inter_subject, intra_session
      model: neurorvq, tinymyo, physiowave
      # data.window_duration: 1.0, 5.0
      # dataset: epn612, ninapro_db5, uci_emg 
      task.from_scratch: False, True
      task.freeze_backbone: True,False
      # experiment.random_seed: 2, 50, 100