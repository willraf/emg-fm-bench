# @package _global_
defaults:
  - override /dataset: epn612
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_length: 200
  split_type: subject
  batch_size: 512

finetuning:
  freeze_backbone: True
  learning_rate: 0.0001

logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_epn612"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data.window_length: 200, 1000
      data.split_type: inter_subject,intra_session
      # finetuning.freeze_backbone: True,False