# @package _global_
defaults:
  - override /dataset: ninapro_db5
  - override /model: tinymyo
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: intra_session
  batch_size: 8

finetuning:
  freeze_backbone: False
  learning_rate: 0.00001

logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_ninaprodb5"

