# @package _global_
defaults:
  - override /dataset: ninapro_db5
  - override /model: physiowave
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: intra_session
  batch_size: 128
  # No band pass filter, per channel z score normalisation and resampling to test original method done by physiowave
  transforms:
    train:
      - ${transforms.standardise}
      # - ${transforms.band_pass}
      - ${transforms.per_channel_z_score_normalise}
      - ${transforms.resample}
      - ${transforms.random_scale}
      - ${transforms.channel_dropout}
      
    val:
      - ${transforms.standardise}
      # - ${transforms.band_pass}
      - ${transforms.per_channel_z_score_normalise}
      - ${transforms.resample}

    test: ${data.transforms.val}



finetuning:
  freeze_backbone: False
  learning_rate: 0.0001

logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_ninaprodb5"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      data.window_length: 200, 1000
      data.split_type: inter_subject,intra_session
      finetuning.freeze_backbone: True,False