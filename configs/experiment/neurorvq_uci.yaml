# @package _global_
defaults:
  - override /dataset: uci_emg
  - override /model: neurorvq
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: inter_subject
  batch_size: 32

finetuning:
  freeze_backbone: True
  learning_rate: 0.0001

experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}_${model.fm.name}_${data.root_key}_${data.window_length}_${data.split_type}_${finetuning.freeze_backbone}_${model.wrapper.pooling_type}


logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_uci_emg"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # data.split_type: inter_subject, intra_session
      data.window_length: 200, 1000
      finetuning.freeze_backbone: True,False
      experiment.random_seed: 2, 50, 100
