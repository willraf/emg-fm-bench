# @package _global_
defaults:
  - override /dataset: ninapro_db5
  - override /model: physiowave
  - override /transforms: transforms
  - _self_

data:
  window_length: 1000
  split_type: inter_subject
  batch_size: 32

task:
  freeze_backbone: False
  learning_rate: 0.0001

experiment:
  name: ${data.root_key}_no_resample/${model.fm.name}_${data.root_key}_${data.window_length}_${data.split_type}_${task.freeze_backbone}_${model.wrapper.pooling_type}/seed${experiment.random_seed}
  random_seed: 2
  use_wandb: True
  wandb_project: "neurorvq_ninaprodb5"

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # data.split_type: inter_subject, intra_session
      # data.window_length: 200, 1000
      task.freeze_backbone: True,False
      experiment.random_seed: 2, 50, 100
