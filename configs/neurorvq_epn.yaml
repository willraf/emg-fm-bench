logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_epn612"


experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}_${model.name}_${data.root_key}_${data.window_length}_${finetuning.split_type}_${finetuning.freeze_backbone}_${finetuning.pooling_type}
  random_seed: 42
  plot_examples: True
  save: True

# Define transforms here
standardise:
  _target_: src.data.transforms.StandardiseSignal
  field: emg

band_pass:
  _target_: src.data.transforms.BandPassFilter 
  lowpass: 90 
  highpass: 20 
  order: 3 
  fs: ${data.sample_rate}

resample:
  _target_: src.data.transforms.Resample 
  field: emg
  target_fs: 1000
  orig_fs: ${data.sample_rate}


neurorvq_embed:
  _target_: src.data.transforms.NeuroRVQEmbeddings
  n_patches: ${model.fm.n_patches}
  global_channels: ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8',
        'c9', 'c10', 'c11', 'c12', 'c13', 'c14', 'c15', 'c16']
  sample_channels: ['c2', 'c4', 'c6', 'c8', 'c10', 'c12', 'c14', 'c16']

encode_stage:
  _target_: src.data.transforms.EncodeStage
  field: stage


pad_length:
  _target_: src.data.transforms.PadCropToLength
  field: emg
  target_length: 5000


window_duration: 5


data:
  name: hdf5_windowed
  root_key: epn612
  primary_data_key: emg
  timeseries_keys: null
  hdf5_path: data/epn612/epn612.hdf5
  num_channels: 8
  metadata_file: ${data.data_dir}/metadata.csv
  # For finetuning, window length must be before resampling
  window_length: 1000      # Can leave as null for full sequence as we will be padding/cropping to a fixed length in the transforms
  sample_rate: 200        # Original sample rate of the data
  stride: null
  num_workers: 10
  subsample: 1.0
  padding: [0, 0]
  batch_size: 32
  transforms:
    train:
      - ${standardise}
      - ${band_pass}
      - ${resample}
      - ${pad_length}
      - ${neurorvq_embed}
      # - _target_: src.data.transforms.RotationAugmentation
      
    val:
      - ${standardise}
      - ${band_pass}
      - ${resample}
      - ${pad_length}
      - ${neurorvq_embed}
      # - _target_: src.data.transforms.RotationAugmentation
    test: ${data.transforms.val}

task:
  name: neuro_rvq_classification


finetuning:
  split_type: session 
  freeze_backbone: False
  finetune_spacial_embedding: True
  pooling_type: concat
  learning_rate: 0.0001
  weight_decay: 0
  n_classes: 6
  target_field: gesture_id
  

training:
  patience: 20
  epochs: 100


model:
  name: neurorvq
  checkpoint: experiments/${experiment.name}/train/checkpoints/best_model.pt
  fm:
    checkpoint: pretrained_models/foundation_models/NeuroRVQ_EMG_foundation_model_v1.pt
    n_patches: 256
    patch_size: 200
    in_chans: 1
    out_chans: 8
    num_classes: 0
    embed_dim: 200
    depth: 12
    num_heads: 10
    mlp_ratio: 4.
    qkv_bias: True
    qk_norm: null
    drop_rate: 0.
    attn_drop_rate: 0.
    drop_path_rate: 0.
    init_values: 1.e-5
    init_scale: 0.001
    n_global_electrodes: 16
    vocab_size: 8192
    use_as_encoder: True
    use_for_pretraining: True