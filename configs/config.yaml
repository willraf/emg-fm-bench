defaults:
  - _self_
  - dataset: ninapro_db5
  - model: neurorvq
  - transforms: transforms
  - task: neuro_rvq_classification

logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "emg_fm_benchmarking"

# Global experiment settings that use interpolation
experiment:
  name: ${now:%Y-%m-%d}_${model.name}_${dataset.root_key}_${finetuning.split_type}
  random_seed: 42
  plot_examples: True
  save: True

training:
  patience: 8
  epochs: 100

finetuning:
  split_type: subject
  freeze_backbone: False
  finetune_spacial_embedding: True
  pooling_type: concat
  learning_rate: 0.0001
  weight_decay: 0
  n_classes: 53
  target_field: gesture_id