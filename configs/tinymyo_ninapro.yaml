hydra:
  mode: MULTIRUN
  sweeper:
    params:
      # data.window_length: 200, 1000
      finetuning.split_type: subject,intra_session
      finetuning.freeze_backbone: True,False
      # finetuning.pooling_type: mean,concat


logging:
  log_interval: 10
  use_wandb: True
  wandb_project: "neurorvq_ninaprodb5"

experiment:
  name: ${now:%Y-%m-%d_%H-%M-%S}_${model.name}_${data.root_key}_${data.window_length}_${finetuning.split_type}_${finetuning.freeze_backbone}_${finetuning.pooling_type}
  random_seed: 42
  plot_examples: True
  save: True

# Define transforms here
standardise:
  _target_: src.data.transforms.StandardiseSignal
  field: emg

band_pass:
  _target_: src.data.transforms.BandPassFilter 
  lowpass: 90 
  highpass: 20 
  order: 3 
  fs: ${data.sample_rate}

resample:
  _target_: src.data.transforms.Resample 
  field: emg
  target_fs: 1000
  orig_fs: ${data.sample_rate}


encode_stage:
  _target_: src.data.transforms.EncodeStage
  field: stage


pad_length:
  _target_: src.data.transforms.PadCropToLength
  field: emg
  target_length: 1000


random_scale:
  _target_: src.data.transforms.RandomAmplitudeScale
  field: emg
  min_scale: 0.9
  max_scale: 1.1

channel_dropout:
  _target_: src.data.transforms.RandomChannelDropout
  field: emg
  dropout_prob: 0.05


data:
  name: hdf5_windowed
  root_key: ninapro_db5
  primary_data_key: emg
  timeseries_keys: null
  hdf5_path: data/ninapro_db5/ninapro_db5.hdf5
  num_channels: 16
  window_length: 1000     # Can leave as null for full sequence as we will be padding/cropping to a fixed length in the transforms
  sample_rate: 200
  stride: 50
  jitter: True
  num_workers: 10
  subsample: 1.0
  padding: [0, 0]
  skip_ik_failures: True
  batch_size: 32
  transforms:
    train:
      - ${standardise}
      - ${band_pass}
      - ${resample}
      - ${random_scale}
      - ${channel_dropout}
      # - ${pad_length}
      # - _target_: src.data.transforms.RotationAugmentation
    val:
      - ${standardise}
      - ${band_pass}
      - ${resample}
      # - ${pad_length}

    test: ${data.transforms.val}

task:
  name: tiny_myo_classification


training:
  patience: 10
  epochs: 100

finetuning:
  split_type: intra_session
  freeze_backbone: True
  finetune_spacial_embedding: True
  pooling_type: concat
  learning_rate: 0.0001
  weight_decay: 0
  n_classes: 53
  target_field: gesture_id

model:
  name: tinymyo
  checkpoint: experiments/${experiment.name}/train/checkpoints/best_model.pt
  fm:
    checkpoint: pretrained_models/TinyMyo/pretraining/base.safetensors