task:
  name: finetune_classification
logging:
  log_interval: 10
  use_wandb: true
  wandb_project: neurorvq_epn612
experiment:
  name: 2026-03-17_22-10-45_neuro_rvq_fm_epn612_1000_inter_subject_False_concat
  random_seed: 42
  plot_examples: true
  save: true
training:
  patience: 8
  epochs: 100
  use_amp: true
finetuning:
  target_field: gesture_id
  freeze_backbone: true
  from_scratch: false
  learning_rate: 1.0e-05
  weight_decay: 0.001
  warmup_epochs: 5
data:
  name: hdf5_windowed
  root_key: epn612
  primary_data_key: emg
  timeseries_keys: null
  hdf5_path: data/epn612/epn612.hdf5
  split_type: inter_subject
  num_channels: 8
  window_length: 1000
  sample_rate: 200
  stride: null
  jitter: true
  num_workers: 10
  batch_size: 32
  transforms:
    train:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.BandPassFilter
      lowpass: 90
      highpass: 20
      order: 3
      fs: 200
    - _target_: src.data.transforms.Resample
      field: emg
      target_fs: 2000
      orig_fs: 200
    - _target_: src.data.transforms.RandomAmplitudeScale
      field: emg
      min_scale: 0.9
      max_scale: 1.1
    - _target_: src.data.transforms.RandomChannelDropout
      field: emg
      dropout_prob: 0.05
    val:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.BandPassFilter
      lowpass: 90
      highpass: 20
      order: 3
      fs: 200
    - _target_: src.data.transforms.Resample
      field: emg
      target_fs: 2000
      orig_fs: 200
    test:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.BandPassFilter
      lowpass: 90
      highpass: 20
      order: 3
      fs: 200
    - _target_: src.data.transforms.Resample
      field: emg
      target_fs: 2000
      orig_fs: 200
  sample_channels:
  - c2
  - c4
  - c6
  - c8
  - c10
  - c12
  - c14
  - c16
  n_classes: 6
model:
  checkpoint: experiments/${experiment.name}/train/checkpoints/best_model.pt
  sample_rate: 1000
  fm:
    name: neuro_rvq_fm
    checkpoint: pretrained_models/NeuroRVQ/foundation_models/NeuroRVQ_EMG_foundation_model_v1.pt
    max_patches: 256
    patch_size: 200
    in_chans: 1
    out_chans: 8
    num_classes: 0
    embed_dim: 200
    depth: 12
    num_heads: 10
    mlp_ratio: 4.0
    qkv_bias: true
    qk_norm: null
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
    init_values: 1.0e-05
    init_scale: 0.001
    n_global_electrodes: 16
    vocab_size: 8192
    use_as_encoder: true
    use_for_pretraining: true
    return_patch_embeddings: true
    sample_channels: ${data.sample_channels}
  wrapper:
    embed_dim: 800
    n_classes: ${data.n_classes}
    patch_size: ${model.fm.patch_size}
    num_channels: ${data.num_channels}
    pooling_type: concat
    finetune_spacial_embedding: true
transforms:
  standardise:
    _target_: src.data.transforms.StandardiseSignal
    field: emg
  band_pass:
    _target_: src.data.transforms.BandPassFilter
    lowpass: 90
    highpass: 20
    order: 3
    fs: 200
  resample:
    _target_: src.data.transforms.Resample
    field: emg
    target_fs: 2000
    orig_fs: 200
  encode_stage:
    _target_: src.data.transforms.EncodeStage
    field: stage
  pad_length:
    _target_: src.data.transforms.PadCropToLength
    field: emg
    target_length: 1000
  random_scale:
    _target_: src.data.transforms.RandomAmplitudeScale
    field: emg
    min_scale: 0.9
    max_scale: 1.1
  channel_dropout:
    _target_: src.data.transforms.RandomChannelDropout
    field: emg
    dropout_prob: 0.05
