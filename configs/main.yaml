task:
  name: finetune_classification
logging:
  log_interval: 10
  use_wandb: true
  wandb_project: neurorvq_ninaprodb5
experiment:
  name: 2026-03-19_17-41-17_neuro_rvq_fm_ninapro_db5_200_intra_session_True_concat
  random_seed: 42
  plot_examples: true
  save: true
training:
  patience: 8
  epochs: 100
  use_amp: true
finetuning:
  target_field: gesture_id
  freeze_backbone: true
  from_scratch: false
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 5
data:
  name: hdf5_windowed
  root_key: ninapro_db5
  primary_data_key: emg
  timeseries_keys: null
  hdf5_path: data/ninapro_db5/ninapro_db5.hdf5
  split_type: intra_session
  num_channels: 16
  window_length: 200
  sample_rate: 200
  stride: 50
  jitter: true
  num_workers: 10
  batch_size: 256
  transforms:
    train:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.BandPassFilter
      lowpass: 90
      highpass: 20
      order: 3
      fs: 200
    - _target_: src.data.transforms.Resample
      field: emg
      target_fs: 1000
      orig_fs: 200
    - _target_: src.data.transforms.RandomAmplitudeScale
      field: emg
      min_scale: 0.9
      max_scale: 1.1
    - _target_: src.data.transforms.RandomChannelDropout
      field: emg
      dropout_prob: 0.05
    val:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.BandPassFilter
      lowpass: 90
      highpass: 20
      order: 3
      fs: 200
    - _target_: src.data.transforms.Resample
      field: emg
      target_fs: 1000
      orig_fs: 200
    test:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.BandPassFilter
      lowpass: 90
      highpass: 20
      order: 3
      fs: 200
    - _target_: src.data.transforms.Resample
      field: emg
      target_fs: 1000
      orig_fs: 200
  sample_channels:
  - c1
  - c3
  - c5
  - c7
  - c9
  - c11
  - c13
  - c15
  - c2
  - c4
  - c6
  - c8
  - c10
  - c12
  - c14
  - c16
  n_classes: 53
model:
  checkpoint: experiments/2026-03-19_17-41-17_neuro_rvq_fm_ninapro_db5_200_intra_session_True_concat/train/checkpoints/best_model.pt
  sample_rate: 1000
  fm:
    name: neuro_rvq_fm
    checkpoint: pretrained_models/NeuroRVQ/foundation_models/NeuroRVQ_EMG_foundation_model_v1.pt
    max_patches: 256
    patch_size: 200
    in_chans: 1
    out_chans: 8
    num_classes: 0
    embed_dim: 200
    depth: 12
    num_heads: 10
    mlp_ratio: 4.0
    qkv_bias: true
    qk_norm: null
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
    init_values: 1.0e-05
    init_scale: 0.001
    n_global_electrodes: 16
    vocab_size: 8192
    use_as_encoder: true
    use_for_pretraining: true
    return_patch_embeddings: true
    sample_channels:
    - c1
    - c3
    - c5
    - c7
    - c9
    - c11
    - c13
    - c15
    - c2
    - c4
    - c6
    - c8
    - c10
    - c12
    - c14
    - c16
  wrapper:
    embed_dim: 800
    n_classes: 53
    patch_size: 200
    num_channels: 16
    pooling_type: concat
    finetune_spacial_embedding: true
transforms:
  standardise:
    _target_: src.data.transforms.StandardiseSignal
    field: emg
  band_pass:
    _target_: src.data.transforms.BandPassFilter
    lowpass: 90
    highpass: 20
    order: 3
    fs: 200
  resample:
    _target_: src.data.transforms.Resample
    field: emg
    target_fs: 1000
    orig_fs: 200
  encode_stage:
    _target_: src.data.transforms.EncodeStage
    field: stage
  pad_length:
    _target_: src.data.transforms.PadCropToLength
    field: emg
    target_length: 1000
  random_scale:
    _target_: src.data.transforms.RandomAmplitudeScale
    field: emg
    min_scale: 0.9
    max_scale: 1.1
  channel_dropout:
    _target_: src.data.transforms.RandomChannelDropout
    field: emg
    dropout_prob: 0.05
