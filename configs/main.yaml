task:
  name: finetune_classification
logging:
  log_interval: 10
  use_wandb: true
  wandb_project: neurorvq_epn612
experiment:
  name: TINYMYO_EPN_BATCH_SIZE
  random_seed: 42
  plot_examples: true
  save: true
training:
  patience: 8
  epochs: 100
  use_amp: true
finetuning:
  target_field: gesture_id
  freeze_backbone: false
  from_scratch: false
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 5
data:
  name: hdf5_windowed
  root_key: epn612
  primary_data_key: emg
  timeseries_keys: null
  hdf5_path: data/epn612/epn612.hdf5
  split_type: intra_session
  num_channels: 8
  window_length: 1000
  sample_rate: 200
  stride: null
  jitter: true
  num_workers: 10
  batch_size: 512
  transforms:
    train:
    - ${transforms.standardise}
    - ${transforms.band_pass}
    - ${transforms.resample}
    - ${transforms.random_scale}
    - ${transforms.channel_dropout}
    val:
    - ${transforms.standardise}
    - ${transforms.band_pass}
    - ${transforms.resample}
    test: ${data.transforms.val}
  sample_channels:
  - c2
  - c4
  - c6
  - c8
  - c10
  - c12
  - c14
  - c16
  n_classes: 6
model:
  name: tinymyo
  sample_rate: 2000
  checkpoint: experiments/${experiment.name}/train/checkpoints/best_model.pt
  fm:
    name: tiny_myo
    checkpoint: pretrained_models/TinyMyo/pretraining/base.safetensors
    img_size: ${data.window_length}
    patch_size: 20
    in_chans: ${data.num_channels}
    embed_dim: 192
    n_layer: 8
    n_head: 3
    mlp_ratio: 4
    qkv_bias: true
    attn_drop: 0.1
    proj_drop: 0.1
    drop_path: 0.1
    task: classification
    classification_type: ml
    reduction_type: concat
    num_classes: 53
    reg_target_len: 500
    return_latent: true
  wrapper:
    embed_dim: ${model.fm.embed_dim}
    n_classes: ${data.n_classes}
    patch_size: ${model.fm.patch_size}
    num_channels: ${data.num_channels}
    pooling_type: concat
    finetune_spacial_embedding: false
transforms:
  standardise:
    _target_: src.data.transforms.StandardiseSignal
    field: emg
  band_pass:
    _target_: src.data.transforms.BandPassFilter
    lowpass: 90
    highpass: 20
    order: 3
    fs: ${data.sample_rate}
  resample:
    _target_: src.data.transforms.Resample
    field: emg
    target_fs: ${model.sample_rate}
    orig_fs: ${data.sample_rate}
  encode_stage:
    _target_: src.data.transforms.EncodeStage
    field: stage
  pad_length:
    _target_: src.data.transforms.PadCropToLength
    field: emg
    target_length: 1000
  random_scale:
    _target_: src.data.transforms.RandomAmplitudeScale
    field: emg
    min_scale: 0.9
    max_scale: 1.1
  channel_dropout:
    _target_: src.data.transforms.RandomChannelDropout
    field: emg
    dropout_prob: 0.05
