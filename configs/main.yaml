training:
  patience: 8
  epochs: 100
  num_accumulation_steps: 1
experiment:
  name: epn612_no_resample/physio_wave_1000_inter_subject_frozen_False_scratch_True_concat/seed2
  save: true
  resume: false
  random_seed: 2
  ddp_debug_mode: false
  use_wandb: true
  wandb_project: epn612
  find_batch_size: true
  plot_examples: true
  log_interval: 10
batch_size_finder:
  min_batch_size: 32
  max_batch_size: 256
  base_batch_size: 128
  base_learning_rate: 0.0001
task:
  name: finetune_classification
  target_field: gesture_id
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_epochs: 5
  use_amp: true
  freeze_backbone: false
  from_scratch: true
data:
  name: hdf5_windowed
  root_key: epn612
  primary_data_key: emg
  timeseries_keys: null
  data_root: data
  hdf5_path: data/epn612/epn612.hdf5
  split_type: inter_subject
  num_channels: 8
  window_length: 1000
  sample_rate: 200
  stride: null
  jitter: true
  num_workers: 5
  batch_size: 32
  transforms:
    train:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.PerChannelZScoreNormalise
      field: emg
    - _target_: src.data.transforms.RandomAmplitudeScale
      field: emg
      min_scale: 0.9
      max_scale: 1.1
    - _target_: src.data.transforms.RandomChannelDropout
      field: emg
      dropout_prob: 0.05
    val:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.PerChannelZScoreNormalise
      field: emg
    test:
    - _target_: src.data.transforms.StandardiseSignal
      field: emg
    - _target_: src.data.transforms.PerChannelZScoreNormalise
      field: emg
  sample_channels:
  - c2
  - c4
  - c6
  - c8
  - c10
  - c12
  - c14
  - c16
  n_classes: 6
model:
  checkpoint: experiments/epn612_no_resample/physio_wave_1000_inter_subject_frozen_False_scratch_True_concat/seed2/train/checkpoints/best_model.pt
  sample_rate: 2000
  fm:
    name: physio_wave
    checkpoint: pretrained_models/PhysioWave/emg.pth
    in_channels: 8
    max_level: 3
    wave_kernel_size: 16
    wavelet_names:
    - sym4
    - sym5
    - db6
    - coif3
    - bior4.4
    use_separate_channel: true
    patch_size: 64
    embed_dim: 256
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    rope_dim: null
    use_pos_embed: true
    pos_embed_type: 2d
    masking_strategy: frequency_guided
    importance_ratio: 0.6
    mask_ratio: 0.15
    task_type: null
    num_classes: null
    output_dim: null
    head_config: null
    pooling: null
  wrapper:
    embed_dim: 256
    n_classes: 6
    patch_size: 64
    num_channels: 8
    pooling_type: concat
    finetune_spacial_embedding: false
transforms:
  standardise:
    _target_: src.data.transforms.StandardiseSignal
    field: emg
  band_pass:
    _target_: src.data.transforms.BandPassFilter
    lowpass: 90
    highpass: 20
    order: 3
    fs: 200
  notch_filter:
    _target_: src.data.transforms.NotchFilter
    notch_freq: 50.0
    quality_factor: 30.0
    fs: 200
    field: emg
  resample:
    _target_: src.data.transforms.Resample
    field: emg
    target_fs: 2000
    orig_fs: 200
  encode_stage:
    _target_: src.data.transforms.EncodeStage
    field: stage
  pad_length:
    _target_: src.data.transforms.PadCropToLength
    field: emg
    target_length: 1000
  random_scale:
    _target_: src.data.transforms.RandomAmplitudeScale
    field: emg
    min_scale: 0.9
    max_scale: 1.1
  channel_dropout:
    _target_: src.data.transforms.RandomChannelDropout
    field: emg
    dropout_prob: 0.05
  per_channel_z_score_normalise:
    _target_: src.data.transforms.PerChannelZScoreNormalise
    field: emg
  global_z_score_normalise:
    _target_: src.data.transforms.GlobalZScoreNormalise
    field: emg
  min_max_normalise:
    _target_: src.data.transforms.MinMaxNormalise
    field: emg
  peak_normalise:
    _target_: src.data.transforms.PeakNormalise
    field: emg
