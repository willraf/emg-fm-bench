
logging:
  log_interval: 10

experiment:
  name: "2026-02-11"
  random_seed: 42
  plot_examples: True
  save: True

to_tensor:
  _target_: src.data.transforms.ExtractToTensor
  field: emg

data:
  name: emg2pose
  num_channels: 16
  data_dir: data/emg2pose_dataset_mini
  # data_dir: /mnt/data/emg2pose_data
  # metadata_file: ${data.data_dir}/metadata.csv
  # Current restrictions on window_length: Must be a multiple of S=strides product (320 here)
  #   and bottleneck size (window_length / (s1*s2*s3)) must be >= padding ( dilation×(K−1)+(1−stride) ) 
  #   stride is 1 in residual units
  window_length: 6400  
  num_workers: 10
  subsample: 1.0
  padding: [0, 0]
  skip_ik_failures: True
  batch_size: 1
  transforms:
    train:
      - ${to_tensor}
      # - _target_: emg2pose.transforms.RotationAugmentation
    val:
      - ${to_tensor}
    test: ${transforms.val}

task:
  name: neuro_rvq_eval

model:
  name: neurorvq
  fm:
    n_patches: 256
    patch_size: 200
    in_chans: 1
    out_chans: 8
    num_classes: 5
    embed_dim: 200
    depth: 12
    num_heads: 10
    mlp_ratio: 4.
    qkv_bias: False
    qk_norm: null
    drop_rate: 0.
    attn_drop_rate: 0.
    drop_path_rate: 0.
    init_values: null
    init_scale: 0.001
    n_global_electrodes: 16
    vocab_size: 8192
    use_as_encoder: True
    use_for_pretraining: False
  
  tokeniser:
    checkpoint: pretrained_models/tokenizers/NeuroRVQ_EMG_tokenizer_v1.pt
    n_code: 8192
    code_dim: 128
    decoder_out_dim: 200
    
    encoder:
      n_patches: 256
      patch_size: 200
      in_chans: 1
      out_chans: 8
      num_classes: 0
      embed_dim: 200
      depth: 12
      num_heads: 10
      mlp_ratio: 4.
      qkv_bias: True
      qk_norm: null
      drop_rate: 0.
      attn_drop_rate: 0.
      drop_path_rate: 0.
      init_values: 0
      init_scale: 0.001
      n_global_electrodes: 16
      vocab_size: 8192
      use_as_encoder: True
      use_for_pretraining: False

    decoder:
      n_patches: 256
      patch_size: 200
      in_chans: 128  #code_dim
      out_chans: 0
      num_classes: 0
      embed_dim: 200
      depth: 3
      num_heads: 10
      mlp_ratio: 4.
      qkv_bias: True
      qk_norm: null
      drop_rate: 0.
      attn_drop_rate: 0.
      drop_path_rate: 0.
      init_values: 0
      init_scale: 0.001
      n_global_electrodes: 16
      vocab_size: 8192
      use_as_encoder: False
      use_for_pretraining: False