task:
  name: finetune_classification
logging:
  log_interval: 10
  use_wandb: true
  wandb_project: neurorvq_ninaprodb5
experiment:
  name: ${data.root_key}/${now:%Y-%m-%d_%H-%M-%S}_${model.fm.name}_${data.root_key}_${data.window_length}_${data.split_type}_${finetuning.freeze_backbone}_${model.wrapper.pooling_type}/seed${experiment.random_seed}
  random_seed: 2
  plot_examples: true
  save: true
  find_batch_size: true
  base_batch_size: 128
  base_learning_rate: 0.0001
  min_batch_size: 32
training:
  patience: 8
  epochs: 100
  use_amp: true
  num_accumulation_steps: 32
finetuning:
  target_field: gesture_id
  freeze_backbone: false
  from_scratch: false
  learning_rate: 2.5e-05
  weight_decay: 0.001
  warmup_epochs: 5
data:
  name: hdf5_windowed
  root_key: ninapro_db5
  primary_data_key: emg
  timeseries_keys: null
  hdf5_path: data/ninapro_db5/ninapro_db5.hdf5
  split_type: inter_subject
  num_channels: 16
  window_length: 1000
  sample_rate: 200
  stride: 50
  jitter: true
  num_workers: 10
  batch_size: 1
  transforms:
    train:
    - ${transforms.standardise}
    - ${transforms.per_channel_z_score_normalise}
    - ${transforms.resample}
    - ${transforms.random_scale}
    - ${transforms.channel_dropout}
    val:
    - ${transforms.standardise}
    - ${transforms.per_channel_z_score_normalise}
    - ${transforms.resample}
    test: ${data.transforms.val}
  sample_channels:
  - c1
  - c3
  - c5
  - c7
  - c9
  - c11
  - c13
  - c15
  - c2
  - c4
  - c6
  - c8
  - c10
  - c12
  - c14
  - c16
  n_classes: 53
model:
  checkpoint: experiments/${experiment.name}/train/checkpoints/best_model.pt
  sample_rate: 2000
  fm:
    name: physio_wave
    checkpoint: pretrained_models/PhysioWave/emg.pth
    in_channels: 8
    max_level: 3
    wave_kernel_size: 16
    wavelet_names:
    - sym4
    - sym5
    - db6
    - coif3
    - bior4.4
    use_separate_channel: true
    patch_size: 64
    embed_dim: 256
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    rope_dim: null
    use_pos_embed: true
    pos_embed_type: 2d
    masking_strategy: frequency_guided
    importance_ratio: 0.6
    mask_ratio: 0.15
    task_type: null
    num_classes: null
    output_dim: null
    head_config: null
    pooling: null
  wrapper:
    embed_dim: ${model.fm.embed_dim}
    n_classes: ${data.n_classes}
    patch_size: ${model.fm.patch_size}
    num_channels: ${data.num_channels}
    pooling_type: concat
    finetune_spacial_embedding: false
transforms:
  standardise:
    _target_: src.data.transforms.StandardiseSignal
    field: emg
  band_pass:
    _target_: src.data.transforms.BandPassFilter
    lowpass: 90
    highpass: 20
    order: 3
    fs: ${data.sample_rate}
  resample:
    _target_: src.data.transforms.Resample
    field: emg
    target_fs: ${model.sample_rate}
    orig_fs: ${data.sample_rate}
  encode_stage:
    _target_: src.data.transforms.EncodeStage
    field: stage
  pad_length:
    _target_: src.data.transforms.PadCropToLength
    field: emg
    target_length: 1000
  random_scale:
    _target_: src.data.transforms.RandomAmplitudeScale
    field: emg
    min_scale: 0.9
    max_scale: 1.1
  channel_dropout:
    _target_: src.data.transforms.RandomChannelDropout
    field: emg
    dropout_prob: 0.05
  per_channel_z_score_normalise:
    _target_: src.data.transforms.PerChannelZScoreNormalise
    field: emg
  global_z_score_normalise:
    _target_: src.data.transforms.GlobalZScoreNormalise
    field: emg
  min_max_normalise:
    _target_: src.data.transforms.MinMaxNormalise
    field: emg
  peak_normalise:
    _target_: src.data.transforms.PeakNormalise
    field: emg
